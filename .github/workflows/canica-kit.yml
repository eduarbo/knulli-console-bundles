# The Canica kit channel for the RG35XX-H: when canica/kit.env changes on main, check the
# pinned installer, prove that the published kit upgrades to it, then sign its manifest and
# publish release canica-<firmware slug>. The updater inside each kit installs it.
# Lives on main of eduarbo/knulli-console-bundles beside the fix bundles, with its own keys:
# canica/keys holds the channel's two public keys (signing and backup), which every kit seals;
# the signing key is the secret CANICA_SIGNING_KEY_B64 of the environment canica-signing.
# Run by hand with dry_run to check and sign without publishing anything.
name: Canica kit

on:
  push:
    branches: [main]
    paths: ['canica/kit.env']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and sign, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: canica-kit
  cancel-in-progress: false

jobs:
  check:
    # Runs the installers' own code (the upgrade test) and holds no secret.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned installer
        run: |
          . canica/kit.env
          curl -fsSL --retry 3 -o installer.sh "$URL"
      - name: It is the pinned file and holds the pinned kit
        run: python3 -I pipeline/canica_manifest.py --pin canica/kit.env --payload installer.sh --dist dist --extract extract
      - name: The kit seals exactly the channel's keys
        run: python3 -I pipeline/canica_keys.py same canica/keys extract/kit/share/system/canica/keys
      - name: It installs on an empty card and over the published kit
        run: |
          . canica/kit.env
          slug=$(python3 -I -c 'import re, sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-"))' "$FIRMWARE")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/canica-$slug"
          earlier=()
          if curl -fsSL -o published.json "$base/manifest.json"; then
            name=$(python3 -I -c 'import json, re, sys; n = json.load(open(sys.argv[1]))["payload"]["name"]; assert re.fullmatch(r"canica-[0-9]+\.sh", n); print(n)' published.json)
            curl -fsSL --retry 3 -o "$name" "$base/$name"
            earlier=("$name")
          fi
          python3 -I pipeline/canica_upgrade_test.py installer.sh "${earlier[@]}"

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds CANICA_SIGNING_KEY_B64; the environment is restricted to main. No kit code runs
    # here: the installers are downloaded again and handled as data, checked against the pin of
    # this checkout before the manifest is signed.
    environment: canica-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned installer
        run: |
          . canica/kit.env
          curl -fsSL --retry 3 -o installer.sh "$URL"
      - name: Check it against the pin and write the manifest
        run: python3 -I pipeline/canica_manifest.py --pin canica/kit.env --payload installer.sh --dist dist --extract extract
      - name: The kit seals exactly the channel's keys
        run: python3 -I pipeline/canica_keys.py same canica/keys extract/kit/share/system/canica/keys
      - name: Privacy scan of the installer and the kit inside it
        env:
          PRIVACY_DENYLIST_B64: ${{ secrets.PRIVACY_DENYLIST_B64 }}
        run: python3 -I pipeline/privacy_scan.py extract dist/manifest.json
      - name: Sign the manifest
        env:
          CANICA_SIGNING_KEY_B64: ${{ secrets.CANICA_SIGNING_KEY_B64 }}
        run: |
          umask 077
          key="$RUNNER_TEMP/canica-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$CANICA_SIGNING_KEY_B64" | base64 -d > "$key"
          bash pipeline/sign.sh dist/manifest.json "$key" canica/keys
      - name: The consoles on the new kit and on the published one accept the signature
        run: |
          bash pipeline/verify.sh dist/manifest.json dist/manifest.json.sig extract/kit/share/system/canica/keys
          . canica/kit.env
          slug=$(python3 -I -c 'import re, sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-"))' "$FIRMWARE")
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/canica-$slug"
          if curl -fsSL -o published.json "$base/manifest.json"; then
            name=$(python3 -I -c 'import json, re, sys; n = json.load(open(sys.argv[1]))["payload"]["name"]; assert re.fullmatch(r"canica-[0-9]+\.sh", n); print(n)' published.json)
            curl -fsSL --retry 3 -o published.sh "$base/$name"
            python3 -I pipeline/canica_keys.py extract published.sh published-keys
            # A kit without its own updater (before RC36) is updated by the owner's add-on, by hand
            if ls published-keys/*.pub > /dev/null 2>&1; then
              bash pipeline/verify.sh dist/manifest.json dist/manifest.json.sig published-keys
            fi
          fi
      - name: Publish the release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pipeline/canica_publish.sh dist canica/keys
      - name: Dry run
        if: github.event_name != 'push' && inputs.dry_run
        run: echo "Dry run. The manifest was checked and signed with a key the kits trust. Nothing was published."
